# deals-proxy — deals.srv1277799.hstgr.cloud (static site built by gen.py + image proxy + click redirect)
# live copy: /root/deals-proxy/nginx.conf  (bind-mounted read-only; edit on host then `docker exec deals-proxy nginx -s reload`)

map_hash_max_size 8192;
map_hash_bucket_size 128;
proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=img:10m max_size=800m inactive=14d use_temp_path=off;
log_format go '$time_iso8601 $arg_d $http_x_forwarded_for "$http_referer" "$http_user_agent"';

# affiliate redirect table, regenerated by gen.py every 10 min (id -> url); both id forms (with/without dashes)
map $arg_d $deal_url {
    default "";
    include /etc/nginx/deals.map;
}

# www -> apex (traefik ส่ง Host เดิมมาให้ nginx เลือก server block ได้)
server {
    listen 80;
    server_name www.paiyaadeals.com;
    return 301 https://paiyaadeals.com$request_uri;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/json application/javascript image/svg+xml application/xml application/rss+xml;
    gzip_min_length 1024;

    # click counter + 302 to the shop. Old shared links used /webhook/go?d=<notion id with dashes> — same map.
    location = /go {
        if ($deal_url = "") { return 302 https://$host/; }
        access_log /var/log/nginx/go.log go if=$deal_url;
        add_header Cache-Control "no-store";
        return 302 $deal_url;
    }
    location = /webhook/go { rewrite ^ /go last; }
    location = /webhook/deals { return 301 https://$host/; }

    # product images through our domain: cached 14 d, same-origin, fetchable by FB/LINE preview bots
    location /img/s/ {
        proxy_pass https://down-th.img.susercontent.com/file/;
        proxy_set_header Host down-th.img.susercontent.com;
        proxy_set_header Referer "";
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_ssl_server_name on;
        proxy_cache img;
        proxy_cache_valid 200 14d;
        proxy_cache_valid any 2m;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        expires 14d;
        add_header X-Cache-Status $upstream_cache_status;
    }
    location /img/l/ {
        proxy_pass https://lzd-img-push.slatic.net/;
        proxy_set_header Host lzd-img-push.slatic.net;
        proxy_set_header Referer "";
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_ssl_server_name on;
        proxy_cache img;
        proxy_cache_valid 200 14d;
        proxy_cache_valid any 2m;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        expires 14d;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /d/ { try_files $uri $uri.html =404; expires 10m; }
    location /c/ { try_files $uri $uri.html =404; expires 10m; }
    location ~* \.(css|svg|ico|png|webp|js)$ { expires 7d; }
    location = /deals.json { expires 10m; }
    location / { try_files $uri $uri/ $uri.html =404; expires 10m; }
    error_page 404 /404.html;
}
