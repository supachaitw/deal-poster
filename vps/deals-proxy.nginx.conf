# cache หน้ารวมดีล — ทุก path คืนหน้าเดียวกัน จึงใช้ key เดียว (กันคนยิง ?x=random ทำ cache บวม)
proxy_cache_path /var/cache/nginx/deals levels=1:2 keys_zone=deals:10m
                 max_size=100m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript;   # text/html เปิดให้เองอยู่แล้ว

    # ทุก path ของ deals.srv1277799.hstgr.cloud → หน้ารวมดีลใน n8n
    location / {
        proxy_pass http://n8n:5678/webhook/deals;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;

        # เดิมทุกคนที่เปิดหน้า = ยิง Notion ใหม่ทั้งชุด (5 requests, ~4 วิ)
        # ตอนนี้เหลือ ~1 ครั้ง/10 นาที ที่เหลือเสิร์ฟจาก cache
        proxy_cache deals;
        proxy_cache_key "deals-page";
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;              # คนเปิดพร้อมกันตอน cache หมดอายุ → ยิง Notion แค่คนเดียว
        proxy_cache_lock_timeout 30s;
        proxy_cache_background_update on; # ต่ออายุเบื้องหลัง คนเปิดไม่ต้องรอ
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
